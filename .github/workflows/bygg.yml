name: Bygg for Mac og Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --release

  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release -p studio -p systemsjekk --target aarch64-apple-darwin
          cargo build --release -p studio -p systemsjekk --target x86_64-apple-darwin
          mkdir -p Studio-Suite-Mac
          for b in studio systemsjekk; do
            lipo -create -output Studio-Suite-Mac/$b \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b
          done
          cp pakke/LES-MEG.txt Studio-Suite-Mac/
          zip -r Studio-Suite-Mac.zip Studio-Suite-Mac
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Suite-Mac
          path: Studio-Suite-Mac.zip

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p studio -p systemsjekk
      - shell: bash
        run: |
          mkdir -p Studio-Suite-Windows
          cp target/release/studio.exe target/release/systemsjekk.exe pakke/LES-MEG.txt Studio-Suite-Windows/
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Suite-Windows
          path: Studio-Suite-Windows/
