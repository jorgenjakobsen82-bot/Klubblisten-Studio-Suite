[workspace]
resolver = "2"
members = ["crates/app", "crates/kjerne", "crates/lydkort", "crates/studio", "crates/systemsjekk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Klubblisten"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
cpal = "0.15.3"
ringbuf = "0.4"
rubato = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
